---
name: Check for workflows
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-for-workflows:
    permissions:
      # Required to commit/push
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # zizmor: ignore[artipacked] needed for git push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          ./fetch.sh -u "${{ github.repository_owner }}" -o repos.md
          ./generate.sh -o dashboard.md -i repos.md
          if [ -z "$(git status -s -- dashboard.md repos.md)" ]; then
            echo No changes to commit
            exit 0
          fi
          git config user.email "check-action@github"
          git config user.name "check-action"
          git add repos.md dashboard.md
          git commit -m "docs: update markdown files"
          git push origin "${GITHUB_REF#refs/heads/}"
